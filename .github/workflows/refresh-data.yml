name: Refresh market data

# Downloads free financials for every US-listed company (SEC EDGAR bulk zip) and
# prices (Yahoo / Stooq), builds the site with that snapshot and deploys it to
# GitHub Pages. The data (tens of MB) is not committed to main.
on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

      - name: Fetch US market snapshot
        env:
          # Required repo variable (Settings > Secrets and variables > Actions > Variables), e.g. "Jane Doe jane@example.com".
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
        run: npm run fetch:us

      - name: Deploy to GitHub Pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm run build
          # --no-history keeps the gh-pages branch at one commit so weekly data doesn't pile up.
          npx gh-pages -d dist --no-history \
            -r "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" \
            -u "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
